name: Personal Tunnel iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26-intel
    timeout-minutes: 90
    defaults:
      run:
        working-directory: source
    steps:
      - name: Checkout source and pinned submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify and restore the exact locally modified fork
        working-directory: .
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          shasum -a 256 -c SOURCE_SHA256SUMS
          git clone --branch audit/independent-client personal-tunnel-source.bundle source
          test "$(git -C source rev-parse HEAD)" = "$(cat source-commit.txt)"
          git -C source submodule update --init --recursive

      - name: Select newest installed Xcode
        id: xcode
        shell: bash
        run: |
          set -euo pipefail
          XCODE_PATH="$(python3 - <<'PY'
          import pathlib, plistlib
          candidates = []
          for path in pathlib.Path('/Applications').glob('Xcode*.app'):
              info = path / 'Contents/Info.plist'
              if not info.exists():
                  continue
              version = plistlib.loads(info.read_bytes()).get('CFBundleShortVersionString', '0')
              if 'beta' in path.name.lower():
                  continue
              numeric = tuple(int(p) for p in version.split('.') if p.isdigit())
              candidates.append((numeric, str(path)))
          if not candidates:
              raise SystemExit('No stable Xcode installed')
          print(max(candidates)[1])
          PY
          )"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          echo "stamp=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Release metadata checks
        run: |
          python3 scripts/release_version.py check
          python3 -m unittest discover -s scripts/tests -p 'test_release_version.py'

      - name: Parser and redaction tests
        run: bash scripts/check_swift_parser_tests.sh

      - name: Restore pinned Libbox cache
        id: libbox-cache
        uses: actions/cache/restore@v4
        with:
          path: source/Libbox.xcframework
          key: libbox-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.stamp }}-${{ hashFiles('source/core/VERSION', 'source/core/overlays/**', 'source/scripts/build_libbox.sh', 'source/scripts/prepare_core.sh', 'source/scripts/apply_singbox_overlays.sh', 'source/scripts/tags/**') }}

      - name: Set up pinned Go
        if: steps.libbox-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache-dependency-path: source/core/sing-box/go.sum

      - name: Build iOS Libbox
        if: steps.libbox-cache.outputs.cache-hit != 'true'
        env:
          VPN_DIRECT_APPLE_PLATFORM: ios
          VPN_DIRECT_FORCE_GOMOBILE_INSTALL: '1'
        run: bash scripts/build_libbox.sh

      - name: Save pinned Libbox cache before application compilation
        if: steps.libbox-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: source/Libbox.xcframework
          key: libbox-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.stamp }}-${{ hashFiles('source/core/VERSION', 'source/core/overlays/**', 'source/scripts/build_libbox.sh', 'source/scripts/prepare_core.sh', 'source/scripts/apply_singbox_overlays.sh', 'source/scripts/tags/**') }}

      - name: Compile unsigned iOS application
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild -project sing-box.xcodeproj -scheme SFI \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/PersonalTunnel.xcresult \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            APP_GROUP_IDENTIFIER=group.a69e6dc9a612eb7d.1 \
            CODE_SIGN_IDENTITY= build 2>&1 | tee build/xcodebuild.log

      - name: Package unsigned IPA for subsequent signing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, shutil, subprocess, sys
          apps = list(pathlib.Path('build/DerivedData/Build/Products/Release-iphoneos').glob('*.app'))
          if len(apps) != 1:
              raise SystemExit(f'Expected one iOS app, got {len(apps)}')
          subprocess.run([sys.executable, 'scripts/release_version.py', 'check', '--app', str(apps[0])], check=True)
          payload = pathlib.Path('build/ipa/Payload')
          payload.mkdir(parents=True, exist_ok=True)
          shutil.copytree(apps[0], payload / apps[0].name, symlinks=True)
          PY
          (cd build/ipa && /usr/bin/ditto -c -k --keepParent Payload ../PersonalTunnel-unsigned.ipa)
          git rev-parse HEAD > build/source-commit.txt
          cp core/VERSION build/core-pins.txt
          shasum -a 256 build/PersonalTunnel-unsigned.ipa > build/SHA256SUMS

      - name: Upload unsigned IPA and provenance
        uses: actions/upload-artifact@v4
        with:
          name: PersonalTunnel-unsigned-${{ github.run_number }}
          path: |
            source/build/PersonalTunnel-unsigned.ipa
            source/build/source-commit.txt
            source/build/core-pins.txt
            source/build/SHA256SUMS
            source/Libbox.xcframework/VPNDirectCore.version
          if-no-files-found: error
          retention-days: 7

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics-${{ github.run_number }}
          path: |
            source/build/xcodebuild.log
            source/build/PersonalTunnel.xcresult
          if-no-files-found: ignore
          retention-days: 7
